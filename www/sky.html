<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A1B27">
<meta name="color-scheme" content="dark">
<title>آسمان‌نما</title>
<link rel="stylesheet" href="sky.css">
</head>
<body>
<canvas id="sky" aria-label="نقشهٔ آسمان"></canvas>

<header class="top">
  <a class="back" href="./index.html" aria-label="بازگشت به قطب‌نما">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    <span>قطب‌نما</span>
  </a>
  <div class="where" id="where" aria-live="off"><b id="whereDate"></b><span id="whereMeta"></span></div>
  <div class="tools">
    <button id="btnSearch" aria-label="جست‌وجو"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button id="btnMenu" aria-label="تنظیمات نمایش"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>

<div class="hud" id="hud"></div>
<div class="targetchip" id="targetChip" hidden><span id="targetName"></span><button id="targetClear" aria-label="حذف هدف">×</button></div>
<div class="toast" id="toast" role="status" hidden></div>

<div class="dock" id="dock">
  <div class="seg" role="group" aria-label="حالت نمایش">
    <button id="modeManual" aria-pressed="true">نقشه</button>
    <button id="modeSensor" aria-pressed="false">رو به آسمان</button>
  </div>
  <div class="timebar" role="group" aria-label="زمان">
    <button id="tDay" data-d="-86400000" aria-label="یک روز عقب">−روز</button>
    <button id="tPrev" data-d="-3600000" aria-label="یک ساعت عقب">−ساعت</button>
    <button id="tNow" class="now" aria-label="اکنون">اکنون</button>
    <button id="tNext" data-d="3600000" aria-label="یک ساعت جلو">+ساعت</button>
    <button id="tPlay" aria-pressed="false" aria-label="گذر سریع زمان">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg>
    </button>
  </div>
</div>

<section class="sheet" id="card" hidden></section>

<section class="sheet" id="menu" hidden>
  <div class="sheet-head"><h2>نمایش</h2><button class="x" data-close aria-label="بستن">×</button></div>
  <div class="toggles" id="toggles"></div>
  <h3>مکان و زمان</h3>
  <div class="fields">
    <label>عرض جغرافیایی<input id="fLat" type="number" step="0.0001" inputmode="decimal"></label>
    <label>طول جغرافیایی<input id="fLon" type="number" step="0.0001" inputmode="decimal"></label>
    <label>انحراف مغناطیسی (شرقی +)<input id="fDecl" type="number" step="0.1" inputmode="decimal"></label>
    <label>تاریخ و ساعت<input id="fTime" type="datetime-local"></label>
  </div>
  <div class="row">
    <button class="btn" id="btnGps">موقعیت من</button>
    <button class="btn ghost" id="btnReset">بازنشانی تنظیمات</button>
  </div>
  <p class="note" id="sharedNote" hidden></p>
</section>

<section class="sheet" id="search" hidden>
  <div class="sheet-head"><input id="q" type="search" placeholder="جست‌وجو: شعرای یمانی، مشتری، جبار، Vega…" autocomplete="off"><button class="x" data-close aria-label="بستن">×</button></div>
  <ul class="results" id="results"></ul>
</section>

<script src="sky-core.js"></script>
<script src="sky-data.js"></script>
<script src="sky.js"></script>
</body>
</html>
